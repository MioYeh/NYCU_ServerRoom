<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>繳費申請 - NYCU BMI 機房管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        try {
            var _u = JSON.parse(localStorage.getItem('bmi_current_user'));
            if (_u && _u.role === 'admin') document.documentElement.classList.add('is-admin');
            else if (_u && _u.role === 'committee') document.documentElement.classList.add('is-committee');
        } catch(e) {}
    </script>
    <style>
        .role-admin-text { display: none; }
        .role-committee-text { display: none; }
        .role-user-text  { display: inline; }
        .is-admin .role-admin-text { display: inline; }
        .is-admin .role-user-text  { display: none; }
        .is-committee .role-committee-text { display: inline; }
        .is-committee .role-user-text  { display: none; }
    </style>
</head>
<body>
    <!-- 頂部導航列 -->
    <nav class="top-nav">
        <div class="nav-brand">
            <i class="fas fa-server"></i>
            <span>NYCU BMI 機房管理</span>
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> 機櫃總覽</a>
            <a href="apply.html" class="nav-link"><i class="fas fa-file-alt"></i> 設備申請</a>
            <a href="renew.html" class="nav-link active"><i class="fas fa-rotate"></i> 繳費申請</a>
            <a href="admin.html" class="nav-link">
                <span class="role-admin-text"><i class="fas fa-user-shield"></i> 管理審核</span>
                <span class="role-committee-text"><i class="fas fa-clipboard-check"></i> 主委審核</span>
                <span class="role-user-text"><i class="fas fa-list-check"></i> 申請進度</span>
            </a>
            <a href="payment.html" class="nav-link"><i class="fas fa-credit-card"></i> 繳費紀錄</a>
        </div>
    </nav>

    <header class="header">
        <div class="header-left">
            <h1><i class="fas fa-rotate"></i> 繳費延期申請單</h1>
        </div>
        <div class="header-right">
            <span class="page-desc">選擇已上架的設備，申請繳費延長使用期間</span>
        </div>
    </header>

    <main class="page-content">
        <div class="page-grid">
            <!-- 左側：繳費申請表單 -->
            <div class="card card-form">
                <div class="card-header">
                    <h2><i class="fas fa-pen-to-square"></i> 填寫繳費申請</h2>
                </div>
                <form id="renewForm" onsubmit="handleRenewSubmit(event)">
                    <div class="form-section">
                        <h3 class="section-title"><i class="fas fa-server"></i> 選擇設備</h3>
                        <div class="form-group">
                            <label for="renewDevice">我的設備 *</label>
                            <select id="renewDevice" required onchange="onDeviceSelected()">
                                <option value="">-- 請選擇要續約的設備 --</option>
                            </select>
                        </div>
                        <!-- 設備資訊摘要 -->
                        <div class="renew-device-info" id="renewDeviceInfo" style="display:none;">
                            <div class="detail-section" style="margin:0;padding:12px;background:#f1f5f9;border-radius:8px;">
                                <div class="detail-row"><span class="detail-label">設備名稱</span><span class="detail-value" id="infoDeviceName">-</span></div>
                                <div class="detail-row"><span class="detail-label">機櫃位置</span><span class="detail-value" id="infoCabinet">-</span></div>
                                <div class="detail-row"><span class="detail-label">大小</span><span class="detail-value" id="infoUSize">-</span></div>
                                <div class="detail-row"><span class="detail-label">申請人 / 單位</span><span class="detail-value" id="infoApplicant">-</span></div>
                                <div class="detail-row"><span class="detail-label">原始上架日期</span><span class="detail-value" id="infoStartDate">-</span></div>
                                <div class="detail-row"><span class="detail-label">目前到期日</span><span class="detail-value" id="infoEndDate" style="font-weight:700;color:#f59e0b;">-</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="section-title"><i class="fas fa-calendar-plus"></i> 延長期間</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="renewNewEndDate">新的到期日 *</label>
                                <input type="date" id="renewNewEndDate" required onchange="updateRenewFeeEstimate()">
                            </div>
                            <div class="form-group">
                                <label>快速選擇</label>
                                <div class="quick-select-btns">
                                    <button type="button" class="btn btn-small btn-outline" onclick="quickExtend(3)">+3 個月</button>
                                    <button type="button" class="btn btn-small btn-outline" onclick="quickExtend(6)">+6 個月</button>
                                    <button type="button" class="btn btn-small btn-outline" onclick="quickExtend(12)">+1 年</button>
                                </div>
                            </div>
                        </div>
                        <div class="fee-estimate-box" id="renewFeeEstimateBox" style="display:none;">
                            <div class="fee-estimate-header"><i class="fas fa-calculator"></i> 延期費用預估</div>
                            <div class="fee-estimate-amount" id="renewFeeEstimateAmount"></div>
                            <div class="fee-estimate-detail" id="renewFeeEstimateDetail"></div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="section-title"><i class="fas fa-comment"></i> 備註</h3>
                        <div class="form-group">
                            <label for="renewNotes">申請原因 / 備註</label>
                            <textarea id="renewNotes" rows="3" placeholder="例如：研究計畫延期，需要繼續使用設備..."></textarea>
                        </div>
                    </div>

                    <div class="form-actions-row">
                        <button type="submit" class="btn btn-primary btn-lg" id="renewSubmitBtn" disabled>
                            <i class="fas fa-paper-plane"></i> 送出繳費申請
                        </button>
                        <button type="reset" class="btn btn-secondary btn-lg" onclick="resetRenewForm()">
                            <i class="fas fa-eraser"></i> 清除表單
                        </button>
                    </div>
                </form>
            </div>

            <!-- 右側：我的繳費申請紀錄 -->
            <div class="card card-list">
                <div class="card-header">
                    <h2><i class="fas fa-list-check"></i> 我的繳費申請紀錄</h2>
                    <div class="card-header-actions">
                        <input type="text" id="renewSearchInput" placeholder="搜尋..." class="search-input" oninput="renderMyRenewals()">
                    </div>
                </div>
                <div class="application-list" id="myRenewalList">
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <p>尚無繳費申請紀錄</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 繳費申請詳情彈窗 -->
    <div class="modal-overlay" id="renewDetailModal" onclick="closeRenewDetail(event)">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-rotate"></i> 繳費申請詳情</h3>
                <button class="btn-close" onclick="closeRenewDetailDirect()">&times;</button>
            </div>
            <div class="modal-body" id="renewDetailContent"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeRenewDetailDirect()">關閉</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/renew.js"></script>
</body>
</html>
