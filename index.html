<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - NYCU BMI 機房管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-server"></i>
                </div>
                <h1>NYCU BMI 機房管理系統</h1>
                <p class="login-subtitle">Server Room Management System</p>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="login-form-group">
                    <label for="email"><i class="fas fa-envelope"></i> 電子郵件</label>
                    <input type="email" id="email" required placeholder="請輸入電子郵件" autocomplete="email" autofocus>
                </div>
                <div class="login-form-group">
                    <label for="password"><i class="fas fa-lock"></i> 密碼</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="請輸入密碼" autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="login-error" id="loginError" style="display:none">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="loginErrorMsg"></span>
                </div>
                <button type="submit" class="btn btn-primary login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> 登入
                </button>
            </form>
            <div class="login-footer">
                <p>&copy; NYCU BMI 機房機櫃管理系統</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // 如果已登入，導向首頁
        if (Auth.isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const errorMsg = document.getElementById('loginErrorMsg');
            const btn = document.getElementById('loginBtn');

            // 按鈕 loading
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登入中...';

            try {
                const result = await Auth.login(email, password);
                if (result.success) {
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.style.display = 'flex';
                    errorMsg.textContent = result.message;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登入';
                    // 抖動效果
                    document.querySelector('.login-card').classList.add('shake');
                    setTimeout(() => {
                        document.querySelector('.login-card').classList.remove('shake');
                    }, 500);
                }
            } catch (err) {
                console.error('登入失敗:', err);
                errorDiv.style.display = 'flex';
                errorMsg.textContent = '網路連線失敗，請稍後再試';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> 登入';
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // Enter 提交
        document.getElementById('password').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('loginForm').requestSubmit();
        });
    </script>
</body>
</html>
