<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申請進度 - NYCU BMI 機房管理</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        try {
            var _u = JSON.parse(localStorage.getItem('bmi_current_user'));
            if (_u && _u.role === 'admin') {
                document.documentElement.classList.add('is-admin');
                document.title = '管理審核 - NYCU BMI 機房管理';
            } else if (_u && _u.role === 'committee') {
                document.documentElement.classList.add('is-committee');
                document.title = '主委審核 - NYCU BMI 機房管理';
            }
        } catch(e) {}
    </script>
    <style>
        /* 依角色即時切換文字，避免閃爍 */
        .role-admin-text { display: none; }
        .role-committee-text { display: none; }
        .role-user-text  { display: inline; }
        .is-admin .role-admin-text { display: inline; }
        .is-admin .role-user-text  { display: none; }
        .is-admin .role-committee-text { display: none; }
        .is-committee .role-committee-text { display: inline; }
        .is-committee .role-user-text  { display: none; }
        .is-committee .role-admin-text { display: none; }
    </style>
</head>
<body>
    <!-- 頂部導航列 -->
    <nav class="top-nav">
        <div class="nav-brand">
            <i class="fas fa-server"></i>
            <span>NYCU BMI 機房管理</span>
        </div>
        <div class="nav-links">
            <a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> 機櫃總覽</a>
            <a href="apply.html" class="nav-link"><i class="fas fa-file-alt"></i> 設備申請</a>
            <a href="renew.html" class="nav-link"><i class="fas fa-rotate"></i> 繳費申請</a>
            <a href="admin.html" class="nav-link active">
                <span class="role-admin-text"><i class="fas fa-user-shield"></i> 管理審核</span>
                <span class="role-committee-text"><i class="fas fa-clipboard-check"></i> 主委審核</span>
                <span class="role-user-text"><i class="fas fa-list-check"></i> 申請進度</span>
            </a>
            <a href="payment.html" class="nav-link"><i class="fas fa-credit-card"></i> 繳費紀錄</a>
        </div>
    </nav>

    <header class="header">
        <div class="header-left">
            <h1>
                <span class="role-admin-text"><i class="fas fa-user-shield"></i> 管理員審核</span>
                <span class="role-committee-text"><i class="fas fa-clipboard-check"></i> 機房主委審核</span>
                <span class="role-user-text"><i class="fas fa-list-check"></i> 我的申請進度</span>
            </h1>
        </div>
        <div class="header-right">
            <div class="admin-stats">
                <span class="badge badge-warning" id="pendingCount">0 待審核</span>
                <span class="badge badge-success" id="approvedCount">0 已通過</span>
                <span class="badge badge-danger" id="rejectedCount">0 已拒絕</span>
            </div>
        </div>
    </header>

    <main class="page-content">
        <!-- 搜尋列 -->
        <div class="admin-toolbar">
            <div class="toolbar-left"></div>
            <div class="toolbar-right">
                <input type="text" id="adminSearch" placeholder="搜尋申請人/設備名..." class="search-input" oninput="renderAdminList()">
            </div>
        </div>

        <!-- 設備申請區塊 -->
        <div class="admin-section-block">
            <div class="admin-section-title">
                <i class="fas fa-file-alt"></i> 設備申請
            </div>
            <div class="admin-toolbar sub-toolbar">
                <div class="toolbar-left">
                    <div class="tab-group">
                        <button class="tab-btn active" data-section="equip" data-filter="all" onclick="setAdminFilter('equip','all', this)">
                            全部 <span class="tab-count" id="tabEquipAll">0</span>
                        </button>
                        <button class="tab-btn" data-section="equip" data-filter="pending" onclick="setAdminFilter('equip','pending', this)">
                            <i class="fas fa-clock"></i> 待審核 <span class="tab-count" id="tabEquipPending">0</span>
                        </button>
                        <button class="tab-btn" data-section="equip" data-filter="approved" onclick="setAdminFilter('equip','approved', this)">
                            <i class="fas fa-check"></i> 已通過 <span class="tab-count" id="tabEquipApproved">0</span>
                        </button>
                        <button class="tab-btn" data-section="equip" data-filter="rejected" onclick="setAdminFilter('equip','rejected', this)">
                            <i class="fas fa-times"></i> 已拒絕 <span class="tab-count" id="tabEquipRejected">0</span>
                        </button>
                        <button class="tab-btn" data-section="equip" data-filter="installed" onclick="setAdminFilter('equip','installed', this)">
                            <i class="fas fa-server"></i> 已上架 <span class="tab-count" id="tabEquipInstalled">0</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="admin-list" id="equipList">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>尚無設備申請紀錄</p>
                </div>
            </div>
        </div>

        <!-- 繳費申請區塊 -->
        <div class="admin-section-block">
            <div class="admin-section-title">
                <i class="fas fa-rotate"></i> 繳費申請
            </div>
            <div class="admin-toolbar sub-toolbar">
                <div class="toolbar-left">
                    <div class="tab-group">
                        <button class="tab-btn active" data-section="renew" data-filter="all" onclick="setAdminFilter('renew','all', this)">
                            全部 <span class="tab-count" id="tabRenewAll">0</span>
                        </button>
                        <button class="tab-btn" data-section="renew" data-filter="pending" onclick="setAdminFilter('renew','pending', this)">
                            <i class="fas fa-clock"></i> 待審核 <span class="tab-count" id="tabRenewPending">0</span>
                        </button>
                        <button class="tab-btn" data-section="renew" data-filter="approved" onclick="setAdminFilter('renew','approved', this)">
                            <i class="fas fa-check"></i> 已通過 <span class="tab-count" id="tabRenewApproved">0</span>
                        </button>
                        <button class="tab-btn" data-section="renew" data-filter="rejected" onclick="setAdminFilter('renew','rejected', this)">
                            <i class="fas fa-times"></i> 已拒絕 <span class="tab-count" id="tabRenewRejected">0</span>
                        </button>
                    </div>
                </div>
            </div>
            <div class="admin-list" id="renewList">
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>尚無繳費申請紀錄</p>
                </div>
            </div>
        </div>

        <!-- 系統管理區域（僅管理員可見）-->
        <div class="user-mgmt-section" id="systemMgmtSection" style="display:none">
            <div class="user-mgmt-header" onclick="toggleSection('systemMgmtBody')">
                <h2>
                    <i class="fas fa-cogs"></i> 系統管理
                    <i class="fas fa-chevron-down section-toggle-icon collapsed" id="systemMgmtBodyIcon"></i>
                </h2>
            </div>
            <div class="section-collapsible collapsed" id="systemMgmtBody">
                <!-- 使用者管理 -->
                <div class="sub-mgmt-block">
                    <div class="sub-mgmt-header">
                        <h3><i class="fas fa-users-cog"></i> 使用者管理</h3>
                        <button class="btn btn-primary btn-sm" onclick="openUserModal()">
                            <i class="fas fa-user-plus"></i> 新增使用者
                        </button>
                    </div>
                    <div class="user-table-wrap">
                        <table class="data-table" id="userTable">
                            <thead>
                                <tr>
                                    <th>使用者</th>
                                    <th>角色</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <!-- 所屬單位管理 -->
                <div class="sub-mgmt-block">
                    <div class="sub-mgmt-header">
                        <h3><i class="fas fa-building"></i> 所屬單位管理</h3>
                        <button class="btn btn-primary btn-sm" onclick="openUnitModal()">
                            <i class="fas fa-plus"></i> 新增單位
                        </button>
                    </div>
                    <div class="user-table-wrap">
                        <table class="data-table" id="unitTable">
                            <thead>
                                <tr>
                                    <th>顏色</th>
                                    <th>單位名稱</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="unitTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 使用者新增/編輯彈窗 -->
    <div class="modal-overlay" id="userModal" onclick="closeUserModal(event)">
        <div class="modal-content user-form-modal">
            <div class="modal-header">
                <h3 id="userModalTitle"><i class="fas fa-user-plus"></i> 新增使用者</h3>
                <button class="btn-close" onclick="closeUserModalDirect()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="userForm" onsubmit="handleUserFormSubmit(event)">
                    <input type="hidden" id="userEditOriginal" value="">
                    <div class="form-group">
                        <label for="userFormUsername">電子郵件 *</label>
                        <input type="email" id="userFormUsername" required placeholder="輸入電子郵件" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="userFormDisplayName">顯示名稱 *</label>
                        <input type="text" id="userFormDisplayName" required placeholder="例如：王大名">
                    </div>
                    <div class="form-group">
                        <label for="userFormPassword">密碼 *</label>
                        <input type="password" id="userFormPassword" required placeholder="輸入密碼（至少 6 字元）" autocomplete="new-password" minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="userFormRole">角色 *</label>
                        <select id="userFormRole" required>
                            <option value="user">一般使用者</option>
                            <option value="committee">機房主委</option>
                            <option value="admin">管理員</option>
                        </select>
                    </div>
                    <div class="form-actions-row">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> 儲存
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeUserModalDirect()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 所屬單位新增/編輯彈窗 -->
    <div class="modal-overlay" id="unitModal" onclick="closeUnitModal(event)">
        <div class="modal-content user-form-modal">
            <div class="modal-header">
                <h3 id="unitModalTitle"><i class="fas fa-building"></i> 新增單位</h3>
                <button class="btn-close" onclick="closeUnitModalDirect()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="unitForm" onsubmit="handleUnitFormSubmit(event)">
                    <input type="hidden" id="unitEditIndex" value="">
                    <div class="form-group">
                        <label for="unitFormName">單位名稱 *</label>
                        <input type="text" id="unitFormName" required placeholder="例如：王教授實驗室" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="unitFormColor">代表顏色 *</label>
                        <div class="color-picker-row">
                            <input type="color" id="unitFormColor" value="#3b82f6" required>
                            <span class="color-hex-label" id="unitColorHex">#3b82f6</span>
                        </div>
                    </div>
                    <div class="form-actions-row">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-save"></i> 儲存
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeUnitModalDirect()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 審核彈窗 -->
    <div class="modal-overlay" id="reviewModal" onclick="closeReviewModal(event)">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h3><i class="fas fa-clipboard-check"></i> 審核申請單</h3>
                <button class="btn-close" onclick="closeReviewModalDirect()">&times;</button>
            </div>
            <div class="modal-body" id="reviewContent"></div>
            <div class="modal-footer" id="reviewActions"></div>
        </div>
    </div>

    <!-- 指派位置彈窗 -->
    <div class="modal-overlay" id="assignModal" onclick="closeAssignModal(event)">
        <div class="modal-content">
            <div class="modal-header bg-success">
                <h3><i class="fas fa-map-marker-alt"></i> 指派機櫃位置</h3>
                <button class="btn-close" onclick="closeAssignModalDirect()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="assignForm" onsubmit="handleAssignSubmit(event)">
                    <input type="hidden" id="assignAppId" value="">
                    <div class="form-group">
                        <label for="assignCabinet">指定機櫃 *</label>
                        <select id="assignCabinet" required onchange="updateAssignHint()">
                            <option value="">-- 選擇機櫃 --</option>
                            <option value="0">機櫃 B (41U)</option>
                            <option value="1">機櫃 C (41U)</option>
                            <option value="2">機櫃 D (41U)</option>
                            <option value="3">機櫃 E (41U)</option>
                            <option value="4">機櫃 F (42U)</option>
                            <option value="5">機櫃 G (42U)</option>
                            <option value="6">機櫃 H (42U)</option>
                            <option value="7">機櫃 I (42U)</option>
                        </select>
                        <small id="assignHint" class="hint"></small>
                    </div>
                    <div class="form-group">
                        <label for="assignStartU">起始 U 位置 * (1 = 底部)</label>
                        <input type="number" id="assignStartU" min="1" max="42" required>
                    </div>
                    <div class="form-group">
                        <label for="assignIP">分配 IP 位址</label>
                        <input type="text" id="assignIP" placeholder="140.113.x.x">
                    </div>
                    <div class="form-group">
                        <label for="assignFee">費用 (NTD)</label>
                        <input type="number" id="assignFee" min="0" value="0" placeholder="0" style="font-weight:700;">
                        <small id="feeCalcHint" class="hint" style="color:#2563eb;white-space:pre-line;"></small>
                    </div>
                    <div class="form-group">
                        <label for="assignAdminNotes">管理員備註</label>
                        <textarea id="assignAdminNotes" rows="2" placeholder="審核備註..."></textarea>
                    </div>
                    <div class="form-actions-row">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-check-circle"></i> 核准並指派位置
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="closeAssignModalDirect()">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
